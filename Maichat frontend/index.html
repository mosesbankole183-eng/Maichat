<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Maichat</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- BACKDROP -->

<div class="backdrop" id="backdrop"></div>

<!-- SIDEBAR -->

<aside class="sidebar glass" id="sidebar">

  <div class="sidebar-header">
    <h2>Maichat</h2>
  </div>

  <button>🖼 Generate Image</button>
  <button>🎬 Generate Video</button>
  <button>⚙ Settings</button>

  <div class="sidebar-bottom">

    <button
      class="cancel-btn"
      id="closeSidebar"
    >
      Cancel
    </button>

  </div>

</aside>

  <!-- TOPBAR -->

  <header class="topbar">

    <div class="top-left">

      <!-- HAMBURGER -->

      <button class="hamburger glass" id="menuBtn">

  <div class="hamburger-lines">
    <span></span>
    <span></span>
    <span></span>
  </div>

      </button>

      <!-- LOGO -->

      <h1 class="logo-title">Maichat</h1>

    </div>

    <!-- NEW CHAT -->

    <button class="new-chat-btn" id="newChatBtn">

      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M12 5H5C3.9 5 3 5.9 3 7V19C3 20.1 3.9 21 5 21H17C18.1 21 19 20.1 19 19V12"
          stroke="white"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M18.375 3.625C18.7728 3.22718 19.3124 3.00366 19.875 3.00366C20.4376 3.00366 20.9772 3.22718 21.375 3.625C21.7728 4.02282 21.9963 4.56239 21.9963 5.125C21.9963 5.68761 21.7728 6.22718 21.375 6.625L12.362 15.638L9 16L9.362 12.638L18.375 3.625Z"
          stroke="white"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

    </button>

  </header>

  <!-- CHAT AREA -->

  <main class="chat-container">

    <div class="chat-window" id="chatWindow">

      <div class="message ai-message">
        <div class="bubble">
          Maichat — Your Multimodal AI Assistant
        </div>
      </div>

    </div>

    <!-- COMPOSER -->

    <div class="composer-area">

      <!-- FILE BUTTON -->

      <button class="attach-btn">

        📎

      </button>

      <!-- INPUT -->

      <div class="composer">

        <textarea
          id="chatInput"
          rows="1"
          placeholder="Message Maichat..."
        ></textarea>

        <!-- VOICE -->

        <button class="voice-btn">

          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M12 15C13.6569 15 15 13.6569 15 12V7C15 5.34315 13.6569 4 12 4C10.3431 4 9 5.34315 9 7V12C9 13.6569 10.3431 15 12 15Z"
              stroke="white"
              stroke-width="2"
            />

            <path
              d="M19 11V12C19 15.866 15.866 19 12 19M5 11V12C5 15.866 8.13401 19 12 19M12 19V22"
              stroke="white"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>

        </button>

        <!-- SEND -->

<button class="send-btn" id="sendBtn">

  <svg
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
  >
    <path
      d="M5 12H19"
      stroke="white"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path
      d="M12 5L19 12L12 19"
      stroke="white"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>

</button>

      </div>

    </div>

  </main>

  <script src="api.js"></script>
  
</body>


<script src="script.js"></script>

</html>
