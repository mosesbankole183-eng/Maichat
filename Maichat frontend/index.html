<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maichat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>

    <div class="brand">
      <h1 class="maichat-title">Maichat</h1>
    </div>
  </header>

  <!-- BACKDROP -->
  <div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>

  <div class="app-layout">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">Maichat</div>

      <button class="new-chat">+ New Chat</button>

      <div class="feature-list">
        <button onclick="generateImage()">🖼 Generate Image</button>
        <button onclick="generateVideo()">🎬 Generate Video</button>
        <button onclick="startVoice()">🎤 Voice Chat</button>
      </div>
    </aside>

    <!-- CHAT AREA -->
    <main class="chat-area">

      <div id="chatWindow" class="chat-window">
        <div class="message ai">
          Maichat — Your Multimodal AI Assistant
        </div>
      </div>

      <div class="input-bar">
        <input
          id="chatInput"
          type="text"
          placeholder="Message Maichat..."
        >
        <button class="send-btn" onclick="sendChat()">➤</button>
      </div>

      <div class="file-upload-bar">
        <label class="upload-btn">
          📎
          <input type="file" id="imageUpload" hidden>
        </label>
        <button onclick="uploadImage()">Upload</button>
      </div>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
