<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maichat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button class="hamburger" id="hamburger" onclick="toggleSidebar()">☰</button>
  <h1 class="maichat-title">Maichat</h1>
  <button class="new-chat-top" onclick="startNewChat()">✎</button>
</header>

<div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="logo">Maichat</div>

  <button onclick="generateImage()">🖼 Generate Image</button>
  <button onclick="generateVideo()">🎬 Generate Video</button>

  <button class="cancel-btn" onclick="closeSidebar()">Cancel</button>
</aside>

<main class="chat-area">

  <div id="chatWindow" class="chat-window">
    <div class="message ai">
      Maichat — Your Multimodal AI Assistant
    </div>
  </div>

  <div class="input-bar">
    <div class="composer-wrap">

      <label class="attach-btn">
        📎
        <input type="file" id="imageUpload" hidden>
      </label>

      <div class="composer-shell">
        <textarea
          id="chatInput"
          rows="1"
          placeholder="Message Maichat..."
          oninput="autoResize(this)"
        ></textarea>

        <button class="voice-btn" onclick="startVoice()">🎤</button>
        <button class="send-btn" onclick="sendChat()">➤</button>
      </div>

    </div>
  </div>

</main>

<script src="script.js"></script>
</body>
</html>
